name: MowologyCRM
options:
  bundleIdPrefix: ca.mowology
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only (use "1,2" for iPhone + iPad)
    DEVELOPMENT_TEAM: ""         # Set your Apple Developer Team ID here
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "100"
    PRODUCT_BUNDLE_IDENTIFIER: ca.mowology.crm-field

targets:
  MowologyCRM:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MowologyCRM
        excludes:
          - "**/*.md"
    info:
      path: MowologyCRM/Resources/Info.plist
      properties:
        CFBundleName: Mowology CRM
        CFBundleDisplayName: Mowology
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Used to record where you clock in and out, and to find the job sites nearest to you."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Records your location while you are clocked in — about once a minute between jobs, more often on a client property — even with the app closed. Nothing is recorded while you are off the clock."
        NSMotionUsageDescription: "Used to detect whether you are walking, driving, or stationary so the app can adjust GPS frequency and save battery during your shift."
        UIBackgroundModes:
          - location
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - ca.mowology.gps-refresh
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        INFOPLIST_FILE: MowologyCRM/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
