name: MowologyCRM
options:
  bundleIdPrefix: ca.mowology
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only (use "1,2" for iPhone + iPad)
    DEVELOPMENT_TEAM: ""         # Set your Apple Developer Team ID here
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: ca.mowology.crm-field

targets:
  MowologyCRM:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MowologyCRM
        excludes:
          - "**/*.md"
    info:
      path: MowologyCRM/Resources/Info.plist
      properties:
        CFBundleName: Mowology CRM
        CFBundleDisplayName: Mowology
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Mowology uses your location to show you on the job map and to record arrival at job sites."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Mowology needs background location access to keep logging your GPS during a shift, even when the app is in the background. This powers proof-of-work tracking and the crew location map."
        UIBackgroundModes:
          - location
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - ca.mowology.crm-field.ping
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        INFOPLIST_FILE: MowologyCRM/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
