name: MowologyCRM
options:
  bundleIdPrefix: ca.mowology
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only (use "1,2" for iPhone + iPad)
    DEVELOPMENT_TEAM: ""         # Set your Apple Developer Team ID here
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "100"
    PRODUCT_BUNDLE_IDENTIFIER: ca.mowology.crm-field

targets:
  MowologyCRM:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MowologyCRM
        excludes:
          - "**/*.md"
    info:
      path: MowologyCRM/Resources/Info.plist
      properties:
        CFBundleName: Mowology CRM
        CFBundleDisplayName: Mowology
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Used to log your GPS location when starting and completing jobs."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Used to send your location to dispatch every 30–120 seconds while you have an active job, even when the app is in the background."
        NSMotionUsageDescription: "Used to detect whether you are walking, driving, or stationary so the app can adjust GPS frequency and save battery during your shift."
        UIBackgroundModes:
          - location
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - ca.mowology.gps-refresh
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        INFOPLIST_FILE: MowologyCRM/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
