; LOCAL TEST ONLY — php.ini for the local test site (scripts/local-site.sh passes it with -c).
; Paths that depend on the machine (session.save_path, sendmail_path, extension_dir, MySQL socket)
; are added by local-site.sh with -d, so this file holds only the fixed policy.

; Show every error locally (production hides them; a fatal there is a silently truncated page).
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
html_errors = On

; Match production limits.
allow_url_fopen = Off
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M
max_execution_time = 120
max_input_vars = 1000
file_uploads = On
date.timezone = America/Vancouver

; OPcache on, but re-checks every file on every request so edits show immediately.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Mail goes nowhere: sendmail_path (set by local-site.sh) is a script that appends to a log.
; SMTP host for Windows-style mail() is irrelevant on macOS but blanked anyway.
SMTP = 127.0.0.1
smtp_port = 9

session.gc_maxlifetime = 32400
