<!-- @dsCard group="Brand" height=420 subtitle="Stable monochrome mark · size ladder, stroke refinement, lockups" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Zen+Kaku+Gothic+New:wght@500&display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--brand);font-family:Inter,system-ui,sans-serif}
.wrap{display:flex;flex-direction:column;gap:28px;padding:20px 24px}
.row{display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--meta);text-align:center}
.lab{font-size:12px;line-height:16px;font-weight:500;color:var(--meta)}
.lock{display:flex;align-items:center;gap:10px;height:40px}
.word{position:relative;display:inline-flex;align-items:center;font-family:"Zen Kaku Gothic New",Inter,sans-serif;font-size:18px;line-height:24px;font-weight:500;letter-spacing:.02em}
.word.br{padding:2px 12px}
.word i{position:absolute;width:7px;height:10px}
.word .tl{left:0;top:0;border-left:1.5px solid currentColor;border-top:1.5px solid currentColor}
.word .bt{right:0;bottom:0;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<g id="sides">
<path pathLength="100" d="M18.96 9.42 A6 6 0 0 1 21.96 8.62 L42.04 8.62 A6 6 0 0 1 45.04 9.42"/>
<path pathLength="100" d="M45.04 9.42 A6 6 0 0 1 47.23 11.62 L57.27 29 A6 6 0 0 1 58.07 32"/>
<path pathLength="100" d="M58.07 32 A6 6 0 0 1 57.27 35 L47.23 52.38 A6 6 0 0 1 45.04 54.58"/>
<path pathLength="100" d="M45.04 54.58 A6 6 0 0 1 42.04 55.38 L21.96 55.38 A6 6 0 0 1 18.96 54.58"/>
<path pathLength="100" d="M18.96 54.58 A6 6 0 0 1 16.77 52.38 L6.73 35 A6 6 0 0 1 5.93 32"/>
<path pathLength="100" d="M5.93 32 A6 6 0 0 1 6.73 29 L16.77 11.62 A6 6 0 0 1 18.96 9.42"/>
</g>
<g id="spokes"><line x1="32" y1="20" x2="32" y2="14"/><line x1="42.39" y1="26" x2="47.59" y2="23"/><line x1="42.39" y1="38" x2="47.59" y2="41"/><line x1="32" y1="44" x2="32" y2="50"/><line x1="21.61" y1="38" x2="16.41" y2="41"/><line x1="21.61" y1="26" x2="16.41" y2="23"/></g>
<g id="sym-24"><use href="#sides" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="65.8 34.2" stroke-dashoffset="-17.1"/><circle cx="32" cy="32" r="9" fill="none" stroke="currentColor" stroke-width="4"/></g>
<g id="sym-32"><use href="#sides" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="73.44 26.56" stroke-dashoffset="-13.28"/><use href="#spokes" stroke="currentColor" stroke-width="2"/><circle cx="32" cy="32" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/></g>
<g id="sym-full"><use href="#sides" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="75.34 24.66" stroke-dashoffset="-12.33"/><use href="#spokes" stroke="currentColor" stroke-width="1.3"/><circle cx="32" cy="32" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/></g>
<g id="sym-full-old"><use href="#sides" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="73.44 26.56" stroke-dashoffset="-13.28"/><use href="#spokes" stroke="currentColor" stroke-width="1.5"/><circle cx="32" cy="32" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/></g>
</defs>
</svg>
<div class="wrap">
<div>
<div class="lab">Size ladder · v1.1.1</div>
<div class="row" style="margin-top:12px">
<div class="cell"><svg width="16" height="16" viewBox="0 0 64 64" role="img" aria-label="Ittai"><use href="#sides" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-dasharray="58.2 41.8" stroke-dashoffset="-20.9"/><circle cx="32" cy="32" r="9" fill="currentColor"/></svg><span class="cap">16</span></div>
<div class="cell"><svg width="24" height="24" viewBox="0 0 64 64" role="img" aria-label="Ittai"><use href="#sym-24"/></svg><span class="cap">24</span></div>
<div class="cell"><svg width="32" height="32" viewBox="0 0 64 64" role="img" aria-label="Ittai"><use href="#sym-32"/></svg><span class="cap">32</span></div>
<div class="cell"><svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Ittai"><use href="#sym-full"/></svg><span class="cap">64 · sides −12.5%</span></div>
<div class="cell"><svg width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="Ittai"><use href="#sym-full"/></svg><span class="cap">128 · sides −12.5%</span></div>
</div>
</div>
<div>
<div class="lab">Stroke refinement at full size · same geometry, same centre</div>
<div class="row" style="margin-top:12px">
<div class="cell"><svg width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="Before"><use href="#sym-full-old"/></svg><span class="cap">Before · sides 4, spokes 1.5</span></div>
<div class="cell"><svg width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="After"><use href="#sym-full"/></svg><span class="cap">After · sides 3.5, spokes 1.3</span></div>
</div>
</div>
<div>

<div class="row" style="margin-top:12px;gap:56px">
<div class="cell" style="align-items:flex-start"><div class="lock"><svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><use href="#sym-24"/></svg><span class="word br"><i class="tl"></i>Ittai 一体<i class="bt"></i></span></div><span class="cap">A · with corner brackets</span></div>
<div class="cell" style="align-items:flex-start"><div class="lock"><svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><use href="#sym-24"/></svg><span class="word">Ittai 一体</span></div><span class="cap">B · symbol and wordmark (recommended permanent)</span></div>
</div>
</div>
</div>
</body>
</html>
