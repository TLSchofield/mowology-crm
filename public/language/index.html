<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ひらがな · Hiragana Games</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #050c07;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', Georgia, serif;
    color: #e8e0d0;
  }
  /* ── Menu ─────────────────────────────── */
  #menu {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #050c07;
    transition: opacity 0.5s;
    z-index: 100;
    overflow-y: auto;
    padding: 40px 20px;
  }
  #menu.hidden { opacity: 0; pointer-events: none; }
  .menu-title {
    font-size: clamp(28px, 5vw, 48px);
    letter-spacing: 12px;
    color: #f0e8d8;
    text-shadow: 0 0 40px rgba(120,200,100,0.2);
    margin-bottom: 6px;
    text-align: center;
  }
  .menu-sub {
    font-size: 11px; letter-spacing: 6px; color: rgba(180,220,150,0.35);
    text-transform: uppercase; margin-bottom: 48px; text-align: center;
  }
  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 860px;
  }
  .game-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 24px 22px;
    cursor: pointer;
    transition: transform 0.18s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: flex; align-items: flex-start; gap: 16px;
  }
  .game-card:hover {
    transform: translateY(-4px) scale(1.02);
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .game-card:active { transform: scale(0.98); }
  .card-icon {
    font-size: 32px; line-height: 1;
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-jp { font-size: 22px; letter-spacing: 4px; margin-bottom: 2px; }
  .card-en { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.5; margin-bottom: 8px; }
  .card-desc { font-size: 12px; opacity: 0.45; line-height: 1.5; font-family: -apple-system, sans-serif; }
  /* ── Game frame ───────────────────────── */
  #frame-wrap {
    position: fixed; inset: 0; z-index: 200;
    pointer-events: none; opacity: 0;
    transition: opacity 0.4s;
  }
  #frame-wrap.visible {
    pointer-events: all; opacity: 1;
  }
  #game-frame {
    width: 100%; height: 100%;
    border: none;
    display: block;
  }
  /* ── Back button ──────────────────────── */
  #back-btn {
    position: fixed; top: 16px; left: 16px;
    z-index: 300;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 40px;
    color: rgba(255,255,255,0.75);
    font-size: 12px; letter-spacing: 3px;
    text-transform: uppercase;
    padding: 8px 18px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: opacity 0.3s, background 0.2s;
    display: none;
    font-family: -apple-system, sans-serif;
  }
  #back-btn.visible { display: block; }
  #back-btn:hover { background: rgba(0,0,0,0.75); }
</style>
</head>

function computeStatuePositions(){const W=window.innerWidth,H=window.innerHeight;const rows=computeRakanRows(W,H);const positions=[];rows.forEach(({y,figH,figW,count,ri})=>{const totalW=count*figW;const startX=(W-totalW)/2;for(let i=0;i<count;i++){const cx=startX+i*figW+figW*0.5;if(cx<figW*0.5||cx>W-figW*0.5)continue;const p=n=>pseudoRand(ri*100+i+n);const figScale=0.72+p(0.7)*0.56;const fh=figH*figScale;const chestY=y-fh*0.55;const scale=fh/90;positions.push({x:cx,y:chestY,scale,feetY:y,figH:fh,row:ri,col:i});}});for(let i=positions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[positions[i],positions[j]]=[positions[j],positions[i]];}return positions;}
function createStatueEl(kanaData,pos,isPreview){const sc=pos.scale;const fsAbove=Math.round(26*sc);const fsEtch=Math.round(20*sc);const aboveY=pos.feetY-pos.figH*0.98;const chestY=pos.feetY-pos.figH*0.52;const wrapH=chestY-aboveY+fsEtch;const wrapW=Math.round(54*sc);const wrap=document.createElement('div');wrap.className='rakan-kana';wrap.style.cssText=\`left:\${pos.x}px;top:\${aboveY}px;width:\${wrapW}px;height:\${wrapH}px;\`;if(isPreview)wrap.classList.add('preview');const aboveEl=document.createElement('div');aboveEl.className='rk-above';const floatDur=(2.8+pseudoRand(pos.x*0.017+pos.feetY*0.009)*1.8).toFixed(2);const floatDelay=(pseudoRand(pos.x*0.023+pos.feetY*0.013)*3.5).toFixed(2);aboveEl.style.cssText=\`top:0;font-size:\${fsAbove}px;--float-dur:\${floatDur}s;--float-delay:-\${floatDelay}s;\`;aboveEl.textContent=kanaData.char;wrap.appendChild(aboveEl);const etchEl=document.createElement('div');etchEl.className='rk-etch';etchEl.dataset.char=kanaData.char;const etchTop=chestY-aboveY-fsEtch*0.5;etchEl.style.cssText=\`top:\${etchTop}px;font-size:\${fsEtch}px;\`;etchEl.textContent=kanaData.char;wrap.appendChild(etchEl);const glow=document.createElement('div');glow.className='rakan-glow';glow.style.cssText=\`left:\${pos.x}px;top:\${pos.feetY-pos.figH*0.5}px;width:\${pos.figH*1.4}px;height:\${pos.figH*1.4}px;margin-left:\${-pos.figH*0.7}px;margin-top:\${-pos.figH*0.7}px;\`;return{wrap,kanaEl:aboveEl,glowEl:glow};}
function applyMasteredEtch(char){const els=scene.querySelectorAll(\`.rk-etch[data-char="\${char}"]\`);if(!els.length)return;const idx=SEQUENCE.findIndex(k=>k.char===char);const el=els[idx%els.length];const col=kanaColor(char);el.classList.add('mastered-etch');el.style.color=col;el.style.textShadow=\`0 0 8px \${col}cc, 0 0 20px \${col}66\`;masteredEtchEls[char]=el;}
function restoreMasteredEtches(){mastered.forEach(char=>applyMasteredEtch(char));}
function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function weightedPick(){const active=SEQUENCE.slice(0,unlockedCount);const weights=active.map(k=>Math.max(1,MASTER_HITS-(hits[k.char]||0)));const total=weights.reduce((s,w)=>s+w,0);let r=Math.random()*total;for(let i=0;i<active.length;i++){r-=weights[i];if(r<=0)return active[i];}return active[active.length-1];}
function buildLanterns(){lanterns.forEach(l=>{if(l.wrap.parentNode)l.wrap.parentNode.removeChild(l.wrap);if(l.glowEl.parentNode)l.glowEl.parentNode.removeChild(l.glowEl);});lanterns=[];const positions=computeStatuePositions();const preview=SEQUENCE[unlockedCount];const active=SEQUENCE.slice(0,unlockedCount);const gameTotal=Math.min(6+unlockedCount*2,28);const pool=[...active];const remain=gameTotal-active.length-(preview?1:0);for(let i=0;i<Math.max(0,remain);i++)pool.push(weightedPick());for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}const flameVariants=['mastered-glow-a','mastered-glow-b','mastered-glow-c'];let flameIdx=0;let poolIdx=0;positions.forEach((pos,i)=>{let kd,isGamePiece=false,isPreviewPiece=false;if(poolIdx<pool.length){kd=pool[poolIdx++];isGamePiece=true;}else if(preview&&!isPreviewPiece&&poolIdx===pool.length){kd=preview;isPreviewPiece=true;poolIdx++;}else{kd=SEQUENCE[Math.floor(pseudoRand(i*7.3+13)*SEQUENCE.length)];}const isMastered=mastered.has(kd.char);const{wrap,kanaEl,glowEl}=createStatueEl(kd,pos,isPreviewPiece||(!isGamePiece));scene.appendChild(wrap);scene.appendChild(glowEl);if(isGamePiece){const obj={char:kd.char,romaji:kd.romaji,wrap,kanaEl,glowEl,lit:isMastered,isPreview:false,pos};lanterns.push(obj);if(isMastered){lightLantern(obj,true);wrap.classList.add(flameVariants[flameIdx%3]);flameIdx++;}else{wrap.addEventListener('click',()=>handleClick(obj));}}else if(isPreviewPiece){lanterns.push({char:kd.char,romaji:kd.romaji,wrap,kanaEl,glowEl,lit:false,isPreview:true,pos});}});restoreMasteredEtches();}
function lightLantern(obj,silent=false){obj.lit=true;obj.wrap.classList.add('lit','igniting');obj.wrap.addEventListener('animationend',()=>obj.wrap.classList.remove('igniting'),{once:true});const col=kanaColor(obj.char);obj.glowEl.classList.add('lit');obj.glowEl.style.background=\`radial-gradient(circle,\${col}28 0%,\${col}10 45%,transparent 70%)\`;if(!silent)playBell();}
function handleClick(obj){if(!running||obj.isPreview||obj.lit)return;if(obj.char===target.char){combo++;const mult=Math.floor(combo/3)+1;const pts=100*mult;score+=pts;scoreVal.textContent=score.toLocaleString();comboVal.textContent=\`×\${mult}\`;lightLantern(obj);spawnScorePop(obj.pos.x,obj.pos.y-50,\`+\${pts}\`);spawnParticles(obj.pos.x,obj.pos.y-obj.pos.scale*60,kanaColor(obj.char));if(combo>1&&combo%3===0){comboFlash.textContent=\`\${combo} combo!\`;comboFlash.classList.remove('show');void comboFlash.offsetWidth;comboFlash.classList.add('show');}hits[obj.char]=(hits[obj.char]||0)+1;if(hits[obj.char]>=MASTER_HITS&&!mastered.has(obj.char)){mastered.add(obj.char);const variants=['mastered-glow-a','mastered-glow-b','mastered-glow-c'];obj.wrap.classList.add(variants[mastered.size%3]);applyMasteredEtch(obj.char);}const unlocked=checkUnlock();buildProgressStrip(unlocked?unlockedCount-1:-1);speakKana(obj.char);setTimeout(()=>{if(!unlocked)chooseTarget();},550);}else{combo=0;comboVal.textContent='×1';obj.wrap.classList.add('wrong');obj.wrap.addEventListener('animationend',()=>obj.wrap.classList.remove('wrong'),{once:true});}}
function chooseTarget(){const pool=lanterns.filter(l=>!l.isPreview&&!l.lit);if(!pool.length){setTimeout(buildLanterns,400);setTimeout(chooseTarget,500);return;}target=pickRandom(pool);targetChar.textContent=target.char;targetRomaji.textContent=target.romaji;targetChar.classList.remove('t-in');void targetChar.offsetWidth;targetChar.classList.add('t-in');const col=kanaColor(target.char);targetChar.style.textShadow=\`0 0 22px \${col}aa,0 0 55px \${col}44\`;}
function checkUnlock(){if(unlockedCount>=SEQUENCE.length)return false;const total=SEQUENCE.slice(0,unlockedCount).reduce((s,k)=>s+(hits[k.char]||0),0);if(total>=unlockedCount*UNLOCK_HITS){unlockedCount++;showUnlockBanner();setTimeout(()=>{buildLanterns();chooseTarget();},2500);return true;}return false;}

function playAhh(ac){const t=ac.currentTime;const root=118+Math.random()*18;const voices=[{fund:root,delay:0,gain:0.30,dur:1.8},{fund:root*1.189,delay:0.06,gain:0.24,dur:1.75},{fund:root*1.498,delay:0.11,gain:0.22,dur:1.85},{fund:root*2.0,delay:0.18,gain:0.18,dur:1.7},{fund:root*2.245,delay:0.08,gain:0.14,dur:1.65},{fund:root*1.005,delay:0.03,gain:0.16,dur:1.9},{fund:root*1.496,delay:0.14,gain:0.12,dur:1.8}];voices.forEach(({fund,delay,gain,dur})=>{const masterGain=ac.createGain();masterGain.connect(ac.destination);const vt=t+delay;masterGain.gain.setValueAtTime(0.001,vt);masterGain.gain.linearRampToValueAtTime(gain,vt+0.14);masterGain.gain.setValueAtTime(gain*0.92,vt+0.6);masterGain.gain.exponentialRampToValueAtTime(0.001,vt+dur);[[1,0.38],[2,0.20],[3,0.13],[4,0.08],[5,0.05]].forEach(([ratio,amp])=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(masterGain);o.type='sine';o.frequency.setValueAtTime(fund*ratio,vt);o.frequency.linearRampToValueAtTime(fund*ratio*1.010,vt+0.35);o.frequency.linearRampToValueAtTime(fund*ratio*0.997,vt+dur-0.2);g.gain.setValueAtTime(amp,vt);o.start(vt);o.stop(vt+dur+0.1);});});}
function playLongAhh(ac){const t=ac.currentTime;const root=112+Math.random()*16;const voices=[{fund:root,delay:0,gain:0.32,dur:4.2},{fund:root*1.189,delay:0.09,gain:0.26,dur:4.0},{fund:root*1.498,delay:0.17,gain:0.24,dur:4.4},{fund:root*2.0,delay:0.05,gain:0.20,dur:3.9},{fund:root*2.245,delay:0.22,gain:0.16,dur:4.1},{fund:root*1.004,delay:0.03,gain:0.18,dur:4.3},{fund:root*1.497,delay:0.13,gain:0.14,dur:4.0},{fund:root*0.998,delay:0.28,gain:0.12,dur:4.5}];voices.forEach(({fund,delay,gain,dur})=>{const masterGain=ac.createGain();masterGain.connect(ac.destination);const vt=t+delay;masterGain.gain.setValueAtTime(0.001,vt);masterGain.gain.linearRampToValueAtTime(gain*0.4,vt+0.3);masterGain.gain.linearRampToValueAtTime(gain,vt+0.9);masterGain.gain.setValueAtTime(gain,vt+dur-1.2);masterGain.gain.exponentialRampToValueAtTime(0.001,vt+dur);[[1,0.38],[2,0.20],[3,0.13],[4,0.09],[5,0.05],[6,0.03]].forEach(([ratio,amp])=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(masterGain);o.type='sine';o.frequency.setValueAtTime(fund*ratio,vt);o.frequency.linearRampToValueAtTime(fund*ratio*1.008,vt+0.8);o.frequency.linearRampToValueAtTime(fund*ratio*0.994,vt+2.2);o.frequency.linearRampToValueAtTime(fund*ratio*1.005,vt+3.4);o.frequency.linearRampToValueAtTime(fund*ratio*0.998,vt+dur);g.gain.setValueAtTime(amp,vt);o.start(vt);o.stop(vt+dur+0.1);});});}
function playHum(ac){const t=ac.currentTime;const root=100+Math.random()*20;const voices=[{fund:root,delay:0,gain:0.28,dur:2.4},{fund:root*1.189,delay:0.08,gain:0.20,dur:2.3},{fund:root*1.498,delay:0.15,gain:0.18,dur:2.5},{fund:root*2.0,delay:0.05,gain:0.14,dur:2.2},{fund:root*1.004,delay:0.12,gain:0.14,dur:2.6}];voices.forEach(({fund,delay,gain,dur})=>{const masterGain=ac.createGain();masterGain.connect(ac.destination);const vt=t+delay;masterGain.gain.setValueAtTime(0.001,vt);masterGain.gain.linearRampToValueAtTime(gain,vt+0.22);masterGain.gain.setValueAtTime(gain*0.9,vt+1.0);masterGain.gain.exponentialRampToValueAtTime(0.001,vt+dur);[[1,0.40],[2,0.12],[3,0.20],[4,0.06],[5,0.12],[6,0.04]].forEach(([ratio,amp])=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(masterGain);o.type='sine';o.frequency.setValueAtTime(fund*ratio,vt);o.frequency.linearRampToValueAtTime(fund*ratio*1.006,vt+0.7);o.frequency.linearRampToValueAtTime(fund*ratio*0.996,vt+dur-0.3);g.gain.setValueAtTime(amp,vt);o.start(vt);o.stop(vt+dur+0.1);});});}
function speakKana(char){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(char);u.lang='ja-JP';u.rate=0.8;u.pitch=1.1;const ja=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));if(ja)u.voice=ja;window.speechSynthesis.speak(u);}

function makeFly(i){const W=ffCanvas.width,H=ffCanvas.height;return{x:Math.random()*W,y:Math.random()*H,tx:Math.random()*W,ty:Math.random()*H,spd:0.18+Math.random()*0.55,blinkPhase:Math.random()*Math.PI*2,blinkSpeed:0.018+Math.random()*0.022,r:2.0+Math.random()*2.2,hue:Math.random()<0.82?(72+Math.random()*28):(42+Math.random()*18),wanderTick:Math.floor(Math.random()*220)};}

function tickFlies(){const W=ffCanvas.width,H=ffCanvas.height;ffCtx.clearRect(0,0,W,H);flies.forEach(f=>{f.wanderTick--;if(f.wanderTick<=0){f.tx=Math.random()*W;f.ty=Math.random()*H;f.wanderTick=140+Math.floor(Math.random()*200);}const dx=f.tx-f.x,dy=f.ty-f.y;const dist=Math.sqrt(dx*dx+dy*dy)||1;f.x+=(dx/dist)*f.spd+(Math.random()-0.5)*0.4;f.y+=(dy/dist)*f.spd+(Math.random()-0.5)*0.4;f.blinkPhase+=f.blinkSpeed;const raw=Math.sin(f.blinkPhase);const alpha=Math.max(0,raw)**1.8;if(alpha<0.01)return;const grad=ffCtx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*4.5);grad.addColorStop(0,\`hsla(\${f.hue},100%,80%,\${alpha*0.55})\`);grad.addColorStop(0.35,\`hsla(\${f.hue},95%,70%,\${alpha*0.28})\`);grad.addColorStop(1,\`hsla(\${f.hue},90%,55%,0)\`);ffCtx.beginPath();ffCtx.arc(f.x,f.y,f.r*4.5,0,Math.PI*2);ffCtx.fillStyle=grad;ffCtx.fill();ffCtx.beginPath();ffCtx.arc(f.x,f.y,f.r*alpha,0,Math.PI*2);ffCtx.fillStyle=\`hsla(\${f.hue},100%,92%,\${alpha*0.95})\`;ffCtx.fill();});requestAnimationFrame(tickFlies);}
