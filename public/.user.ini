; cPanel-generated php ini directives, do not edit
; Manual editing of this file may result in unexpected behavior.
; To make changes to this file, use the cPanel MultiPHP INI Editor (Home >> Software >> MultiPHP INI Editor)
; For more information, read our documentation (https://go.cpanel.net/EA4ModifyINI)

[PHP]
display_errors = Off
max_execution_time = 600
max_input_time = 60
max_input_vars = 1000
memory_limit = 256M
post_max_size = 64M
session.gc_maxlifetime = 32400
session.save_path = "/var/cpanel/php/sessions/alt-php74"
upload_max_filesize = 64M
zlib.output_compression = Off

; OPcache: auto-pick-up deployed PHP changes without a manual reset.
; Re-stat files at most every 2s instead of caching them indefinitely.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
