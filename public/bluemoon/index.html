<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BlueMoon</title>

  <!-- No indexing — private app -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- PWA / install-to-homescreen -->
  <link rel="manifest" href="/bluemoon/manifest.webmanifest" />
  <meta name="theme-color" content="#070B18" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BlueMoon" />
  <link rel="apple-touch-icon" href="/bluemoon/icons/icon-192.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #070B18;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* Top 2/3: vortex canvas */
    #canvas-wrap {
      position: relative;
      flex: 0 0 66.67%;
      overflow: hidden;
    }
    #vortex {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Center tap zone */
    #center-tap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 140px; height: 140px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex; align-items: center; justify-content: center;
    }

    /* Bottom 1/3: habit dock */
    #habit-dock {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      overflow: hidden;
    }

    .habit-btn {
      width: 100%; max-width: 420px;
      padding: 10px 16px;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: rgba(255,255,255,0.90);
      cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .habit-btn:active { background: rgba(255,255,255,0.07); }
    .habit-btn.tapped { background: rgba(255,255,255,0.04); }

    .habit-icon { flex-shrink: 0; display: block; }

    .habit-label {
      font-size: 15px; font-weight: 500; letter-spacing: 0.02em;
      color: rgba(255,255,255,0.90);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-family: monospace;
    }

    /* Install banner */
    #install-banner {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 14px 20px;
      background: rgba(10,14,30,0.97);
      border-top: 1px solid rgba(255,255,255,0.12);
      z-index: 9999;
      align-items: center; gap: 12px;
    }
    #install-banner.show { display: flex; }
    #install-banner p { color: rgba(255,255,255,0.85); font-size: 14px; flex: 1; }
    #install-banner button { padding: 8px 18px; border-radius: 8px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
    #btn-install { background: #4A9EFF; color: #fff; }
    #btn-dismiss { background: transparent; color: rgba(255,255,255,0.5); }

    /* iOS install hint (no beforeinstallprompt on Safari) */
    #ios-hint {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 14px 20px 28px;
      background: rgba(10,14,30,0.97);
      border-top: 1px solid rgba(255,255,255,0.12);
      z-index: 9999;
      flex-direction: column; gap: 8px;
    }
    #ios-hint.show { display: flex; }
    #ios-hint p { color: rgba(255,255,255,0.8); font-size: 13px; line-height: 1.5; }
    #ios-hint button { align-self: flex-end; padding: 6px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: rgba(255,255,255,0.6); font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

<div id="app">
  <div id="canvas-wrap">
    <canvas id="vortex"></canvas>
    <div id="center-tap"></div>
  </div>
  <div id="habit-dock"></div>
</div>

<div id="install-banner">
  <p>Add BlueMoon to your home screen for the full experience.</p>
  <button id="btn-dismiss">Later</button>
  <button id="btn-install">Install</button>
</div>

<div id="ios-hint">
  <p>Install BlueMoon: tap <strong>Share ⬆</strong> then <strong>"Add to Home Screen"</strong></p>
  <button id="btn-ios-dismiss">OK</button>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// BlueMoon — Main thread (input + PWA only when OffscreenCanvas available)
// Physics + rendering runs in vortex.worker.js via OffscreenCanvas
// Fallback: inline Canvas2D on main thread for older browsers
// ─────────────────────────────────────────────────────────────────────────────

const STORAGE_KEY_HABITS = 'bluemoon_habits';
const STORAGE_KEY_EVENTS = 'bluemoon_events';
const STORAGE_KEY_IOS    = 'bluemoon_ios_hint_shown';

function loadHabits() {
  try { const r=localStorage.getItem(STORAGE_KEY_HABITS); if(r) return JSON.parse(r); } catch{}
  return [
    { id:'h1', label:'Siu Nim Tau' },
    { id:'h2', label:'Monkey Face Wall' },
    { id:'h3', label:'Stone Forge' },
  ];
}
function loadEvents() {
  try { const r=localStorage.getItem(STORAGE_KEY_EVENTS); if(r) return JSON.parse(r); } catch{}
  return [];
}
function saveEvents(evs) { localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(evs)); }

const habits  = loadHabits();
let   events  = loadEvents();
const dockEl  = document.getElementById('habit-dock');
const canvas  = document.getElementById('vortex');

// ── Hex+Wedge icon renderer ───────────────────────────────────────────────────
const HEX_SIZE    = 40;
const HEX_RADIUS  = (HEX_SIZE / 2) * 0.78;
const HEX_ROT_RAD = -Math.PI / 2; // point-up

const C_BLUE      = 'rgba(90,160,255,0.92)';
const C_BLUE_DIM  = 'rgba(90,160,255,0.55)';
const C_WHITE_DIM = 'rgba(255,255,255,0.30)';
const C_WHITE_FNT = 'rgba(255,255,255,0.12)';

function hexVertices(r) {
  const v = [];
  for (let i = 0; i < 6; i++) {
    const a = (i * Math.PI) / 3 + HEX_ROT_RAD;
    v.push([r * Math.cos(a), r * Math.sin(a)]);
  }
  return v;
}

function drawHexWedge(canvas, reinforcerCount) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = HEX_SIZE * dpr;
  canvas.height = HEX_SIZE * dpr;
  canvas.style.width  = HEX_SIZE + 'px';
  canvas.style.height = HEX_SIZE + 'px';

  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.translate(HEX_SIZE / 2, HEX_SIZE / 2);

  const r = HEX_RADIUS;
  const verts = hexVertices(r);
  const litCount = Math.max(0, Math.min(6, reinforcerCount));

  // Faint wedge fills
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = C_WHITE_FNT;
  for (let i = 0; i < 6; i++) {
    const v1 = verts[i], v2 = verts[(i + 1) % 6];
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(v1[0], v1[1]); ctx.lineTo(v2[0], v2[1]);
    ctx.closePath();
    ctx.stroke();
  }

  // Lit wedges (bright blue)
  ctx.strokeStyle = C_BLUE;
  for (let i = 0; i < litCount; i++) {
    const v1 = verts[i], v2 = verts[(i + 1) % 6];
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(v1[0], v1[1]); ctx.lineTo(v2[0], v2[1]);
    ctx.closePath();
    ctx.stroke();
  }

  // Hex outline
  ctx.strokeStyle = C_WHITE_DIM;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(verts[0][0], verts[0][1]);
  for (let i = 1; i < 6; i++) ctx.lineTo(verts[i][0], verts[i][1]);
  ctx.closePath();
  ctx.stroke();

  ctx.restore();
}

// ── Habit dock ────────────────────────────────────────────────────────────────
// tapCounts[habitId] = number of taps today (drives wedge lit count)
const tapCounts = {};

function getTodayTapCount(habitId) {
  const todayStr = new Date().toDateString();
  return events.filter(e => e.habitId === habitId && new Date(e.ts).toDateString() === todayStr).length;
}

function buildDock() {
  dockEl.innerHTML = '';
  habits.forEach(h => {
    tapCounts[h.id] = getTodayTapCount(h.id);

    const btn = document.createElement('button');
    btn.className = 'habit-btn';

    // Canvas icon
    const cvs = document.createElement('canvas');
    cvs.className = 'habit-icon';
    drawHexWedge(cvs, tapCounts[h.id]);
    btn.appendChild(cvs);

    // Label
    const lbl = document.createElement('span');
    lbl.className   = 'habit-label';
    lbl.textContent = h.label;
    btn.appendChild(lbl);

    btn.addEventListener('click', () => onHabitTap(h.id, btn, cvs));
    dockEl.appendChild(btn);
  });
}

function onHabitTap(habitId, btn, cvs) {
  const ev = { id:'c_'+Math.random().toString(16).slice(2), ts:Date.now(), habitId };
  events.push(ev);
  saveEvents(events);
  notifyWorkerEvents();

  // Increment tap count and redraw hex
  tapCounts[habitId] = (tapCounts[habitId] || 0) + 1;
  drawHexWedge(cvs, tapCounts[habitId]);

  btn.classList.add('tapped');
  setTimeout(() => btn.classList.remove('tapped'), 600);
}

// ── OffscreenCanvas + Worker path ─────────────────────────────────────────────
let worker    = null;
let usingWorker = false;

function notifyWorkerEvents() {
  if (worker) worker.postMessage({ type:'events', events });
}

function startWorker() {
  if (!('OffscreenCanvas' in window)) return false;
  if (!canvas.transferControlToOffscreen) return false;
  try {
    worker = new Worker('/bluemoon/vortex.worker.js');
    const dpr = window.devicePixelRatio || 1;
    const W   = window.innerWidth;
    const H   = window.innerHeight;
    const cH  = H * 0.667;
    // Must set pixel dimensions BEFORE transferControlToOffscreen
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(cH * dpr);
    canvas.style.width  = W  + 'px';
    canvas.style.height = cH + 'px';
    const offscreen = canvas.transferControlToOffscreen();
    worker.postMessage(
      { type:'init', canvas:offscreen, width:W, height:H, devicePixelRatio:dpr, events },
      [offscreen]
    );
    usingWorker = true;

    window.addEventListener('resize', () => {
      const W2=window.innerWidth, H2=window.innerHeight, cH2=H2*0.667;
      canvas.style.width=W2+'px'; canvas.style.height=cH2+'px';
      worker.postMessage({ type:'resize', width:W2, height:H2, devicePixelRatio:window.devicePixelRatio||1, events });
    });
    return true;
  } catch(e) { return false; }
}

// ── Fallback: inline Canvas2D ─────────────────────────────────────────────────
function startFallback() {
  // Inline the full engine as a script tag, then init
  const s = document.createElement('script');
  s.src   = '/bluemoon/vortex.fallback.js';
  s.onload = () => { if (window.VortexFallback) window.VortexFallback.init(canvas, events, habits); };
  document.head.appendChild(s);
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildDock();

const workerStarted = startWorker();
if (!workerStarted) startFallback();

// Center tap
document.getElementById('center-tap').addEventListener('click', () => {
  // Could open a relic screen — for now just a visual burst via worker
  if (worker) worker.postMessage({ type:'pulse' });
});

// ─────────────────────────────────────────────────────────────────────────────
// PWA — Install prompt
// ─────────────────────────────────────────────────────────────────────────────
let deferredPrompt = null;
const banner     = document.getElementById('install-banner');
const btnInstall = document.getElementById('btn-install');
const btnDismiss = document.getElementById('btn-dismiss');
const iosHint    = document.getElementById('ios-hint');
const btnIos     = document.getElementById('btn-ios-dismiss');

// Android / Chrome — standard prompt
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  banner.classList.add('show');
});

btnInstall.addEventListener('click', async () => {
  banner.classList.remove('show');
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});
btnDismiss.addEventListener('click', () => {
  banner.classList.remove('show');
  deferredPrompt = null;
});
window.addEventListener('appinstalled', () => banner.classList.remove('show'));

// iOS Safari — manual "Add to Home Screen" hint (shown once)
const isIos      = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone === true
  || window.matchMedia('(display-mode: standalone)').matches;

if (isIos && !isStandalone && !localStorage.getItem(STORAGE_KEY_IOS)) {
  setTimeout(() => iosHint.classList.add('show'), 2500);
}
btnIos.addEventListener('click', () => {
  iosHint.classList.remove('show');
  localStorage.setItem(STORAGE_KEY_IOS, '1');
});

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/bluemoon/sw.js').catch(()=>{});
}
</script>
</body>
</html>
