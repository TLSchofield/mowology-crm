<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BlueMoon</title>

  <!-- No indexing — private app -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- PWA / install-to-homescreen -->
  <link rel="manifest" href="/bluemoon/manifest.webmanifest" />
  <meta name="theme-color" content="#070B18" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BlueMoon" />
  <link rel="apple-touch-icon" href="/bluemoon/icons/icon-192.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* ── Admin navbar ── */
    #admin-nav {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px 10px;
      background: rgba(5,7,12,0.96);
      border-bottom: 1px solid rgba(100,180,255,0.13);
      z-index: 200;
    }
    .nav-tab {
      padding: 5px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(180,210,255,0.40);
      font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .nav-tab.active {
      background: rgba(80,160,255,0.18);
      border-color: rgba(100,200,255,0.35);
      color: rgba(200,235,255,0.95);
    }

    /* ── Overlay panel (sits over vortex+dock) ── */
    #panel-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 100;
      background: rgba(4,6,14,0.96);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #panel-overlay.open { display: flex; }

    .panel-title {
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      color: rgba(140,190,255,0.40);
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* Glyph canvas */
    #glyph-canvas { display: block; }

    /* Model (GLB) panel */
    #model-wrap {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #model-canvas {
      display: block;
      border-radius: 16px;
      touch-action: none;
    }
    .model-hint {
      font-size: 10px;
      color: rgba(140,190,255,0.30);
      letter-spacing: 0.3px;
    }

    /* Fractal panel */
    #fractal-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    #fractal-canvas { display: block; }
    .fractal-controls {
      display: flex; gap: 8px;
    }
    .fractal-pill {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid rgba(80,160,255,0.22);
      background: rgba(80,160,255,0.08);
      color: rgba(200,235,255,0.85);
      font-size: 11px; font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .fractal-progress {
      font-size: 11px; color: rgba(140,190,255,0.50);
      font-weight: 700; letter-spacing: 0.3px;
    }

    /* Top 2/3: vortex canvas */
    #canvas-wrap {
      position: relative;
      flex: 0 0 66.67%;
      overflow: hidden;
      /* Deep space nebula — radial glow from centre */
      background:
        radial-gradient(ellipse 55% 55% at 50% 50%,
          rgba(30, 60, 140, 0.55) 0%,
          rgba(15, 30, 80,  0.38) 35%,
          rgba(5,  12, 35,  0.25) 60%,
          transparent 100%),
        radial-gradient(ellipse 90% 80% at 50% 50%,
          rgba(8, 18, 50, 0.7) 0%,
          #000 75%);
    }
    #vortex {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Center tap zone */
    #center-tap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 140px; height: 140px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex; align-items: center; justify-content: center;
    }

    /* Bottom 1/3: habit dock */
    #habit-dock {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      overflow: hidden;
    }

    .habit-btn {
      width: 100%; max-width: 420px;
      padding: 10px 16px;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: rgba(255,255,255,0.90);
      cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .habit-btn:active { background: rgba(255,255,255,0.07); }
    .habit-btn.tapped { background: rgba(255,255,255,0.04); }

    .habit-icon { flex-shrink: 0; display: block; }

    .habit-label {
      font-size: 15px; font-weight: 500; letter-spacing: 0.02em;
      color: rgba(255,255,255,0.90);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-family: monospace;
    }

    /* Install banner */
    #install-banner {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 14px 20px;
      background: rgba(10,14,30,0.97);
      border-top: 1px solid rgba(255,255,255,0.12);
      z-index: 9999;
      align-items: center; gap: 12px;
    }
    #install-banner.show { display: flex; }
    #install-banner p { color: rgba(255,255,255,0.85); font-size: 14px; flex: 1; }
    #install-banner button { padding: 8px 18px; border-radius: 8px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
    #btn-install { background: #4A9EFF; color: #fff; }
    #btn-dismiss { background: transparent; color: rgba(255,255,255,0.5); }

    /* iOS install hint (no beforeinstallprompt on Safari) */
    #ios-hint {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 14px 20px 28px;
      background: rgba(10,14,30,0.97);
      border-top: 1px solid rgba(255,255,255,0.12);
      z-index: 9999;
      flex-direction: column; gap: 8px;
    }
    #ios-hint.show { display: flex; }
    #ios-hint p { color: rgba(255,255,255,0.8); font-size: 13px; line-height: 1.5; }
    #ios-hint button { align-self: flex-end; padding: 6px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: rgba(255,255,255,0.6); font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

<div id="app">
  <div id="admin-nav">
    <button class="nav-tab" data-panel="glyphs">Glyphs</button>
    <button class="nav-tab" data-panel="moon">Moon</button>
    <button class="nav-tab" data-panel="model">Model</button>
    <button class="nav-tab" data-panel="fractal">Fractal</button>
  </div>
  <div style="position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div id="panel-overlay">
      <!-- Glyphs panel -->
      <div id="panel-glyphs" class="panel-inner" style="display:none;flex-direction:column;align-items:center;gap:10px;">
        <div class="panel-title">Glyph Library</div>
        <canvas id="glyph-canvas"></canvas>
      </div>
      <!-- Moon panel -->
      <div id="panel-moon" class="panel-inner" style="display:none;flex-direction:column;align-items:center;gap:12px;">
        <div class="panel-title">Moon · Vortex</div>
        <div style="color:rgba(140,190,255,0.35);font-size:13px;">Vortex running behind</div>
      </div>
      <!-- Model panel -->
      <div id="panel-model" class="panel-inner" style="display:none;flex-direction:column;align-items:center;width:100%;height:100%;">
        <div class="panel-title">Neon Monkey</div>
        <div id="model-wrap">
          <canvas id="model-canvas"></canvas>
          <div class="model-hint">drag to rotate · pinch to zoom</div>
        </div>
      </div>
      <!-- Fractal panel -->
      <div id="panel-fractal" class="panel-inner" style="display:none;flex-direction:column;align-items:center;gap:14px;">
        <div class="panel-title">Fractal Relic</div>
        <div id="fractal-wrap">
          <canvas id="fractal-canvas"></canvas>
          <div class="fractal-controls">
            <button class="fractal-pill" id="fractal-btn-earned">Earned: 0</button>
            <button class="fractal-pill" id="fractal-btn-color">Color: sample</button>
          </div>
          <div class="fractal-progress" id="fractal-progress">0 / 400 · 0%</div>
        </div>
      </div>
    </div>
    <div id="canvas-wrap">
      <canvas id="vortex"></canvas>
      <div id="center-tap"></div>
    </div>
    <div id="habit-dock"></div>
  </div>
</div>

<div id="install-banner">
  <p>Add BlueMoon to your home screen for the full experience.</p>
  <button id="btn-dismiss">Later</button>
  <button id="btn-install">Install</button>
</div>

<div id="ios-hint">
  <p>Install BlueMoon: tap <strong>Share ⬆</strong> then <strong>"Add to Home Screen"</strong></p>
  <button id="btn-ios-dismiss">OK</button>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// BlueMoon — Main thread (input + PWA only when OffscreenCanvas available)
// Physics + rendering runs in vortex.worker.js via OffscreenCanvas
// Fallback: inline Canvas2D on main thread for older browsers
// ─────────────────────────────────────────────────────────────────────────────

const STORAGE_KEY_HABITS = 'bluemoon_habits';
const STORAGE_KEY_EVENTS = 'bluemoon_events';
const STORAGE_KEY_IOS    = 'bluemoon_ios_hint_shown';

function loadHabits() {
  try { const r=localStorage.getItem(STORAGE_KEY_HABITS); if(r) return JSON.parse(r); } catch{}
  return [
    { id:'h1', label:'Siu Nim Tau' },
    { id:'h2', label:'Monkey Face Wall' },
    { id:'h3', label:'Stone Forge' },
  ];
}
function loadEvents() {
  try { const r=localStorage.getItem(STORAGE_KEY_EVENTS); if(r) return JSON.parse(r); } catch{}
  return [];
}
function saveEvents(evs) { localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(evs)); }

const habits  = loadHabits();
let   events  = loadEvents();
const dockEl  = document.getElementById('habit-dock');
const canvas  = document.getElementById('vortex');

// ── Hex+Wedge icon renderer ───────────────────────────────────────────────────
const HEX_SIZE    = 40;
const HEX_RADIUS  = (HEX_SIZE / 2) * 0.78;
const HEX_ROT_RAD = -Math.PI / 2; // point-up

const C_BLUE      = 'rgba(90,160,255,0.92)';
const C_BLUE_DIM  = 'rgba(90,160,255,0.55)';
const C_WHITE_DIM = 'rgba(255,255,255,0.30)';
const C_WHITE_FNT = 'rgba(255,255,255,0.12)';

function hexVertices(r) {
  const v = [];
  for (let i = 0; i < 6; i++) {
    const a = (i * Math.PI) / 3 + HEX_ROT_RAD;
    v.push([r * Math.cos(a), r * Math.sin(a)]);
  }
  return v;
}

function drawHexWedge(cvs, reinforcerCount) {
  const dpr = window.devicePixelRatio || 1;
  cvs.width  = HEX_SIZE * dpr;
  cvs.height = HEX_SIZE * dpr;
  cvs.style.width  = HEX_SIZE + 'px';
  cvs.style.height = HEX_SIZE + 'px';

  const ctx = cvs.getContext('2d');
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.translate(HEX_SIZE / 2, HEX_SIZE / 2);

  const r = HEX_RADIUS;
  const verts = hexVertices(r);
  const litCount = Math.max(0, Math.min(6, reinforcerCount));

  // Faint wedge fills
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = C_WHITE_FNT;
  for (let i = 0; i < 6; i++) {
    const v1 = verts[i], v2 = verts[(i + 1) % 6];
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(v1[0], v1[1]); ctx.lineTo(v2[0], v2[1]);
    ctx.closePath();
    ctx.stroke();
  }

  // Lit wedges (bright blue)
  ctx.strokeStyle = C_BLUE;
  for (let i = 0; i < litCount; i++) {
    const v1 = verts[i], v2 = verts[(i + 1) % 6];
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(v1[0], v1[1]); ctx.lineTo(v2[0], v2[1]);
    ctx.closePath();
    ctx.stroke();
  }

  // Hex outline
  ctx.strokeStyle = C_WHITE_DIM;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(verts[0][0], verts[0][1]);
  for (let i = 1; i < 6; i++) ctx.lineTo(verts[i][0], verts[i][1]);
  ctx.closePath();
  ctx.stroke();

  ctx.restore();
}

// ── Habit dock ────────────────────────────────────────────────────────────────
// tapCounts[habitId] = number of taps today (drives wedge lit count)
const tapCounts = {};

function getTodayTapCount(habitId) {
  const todayStr = new Date().toDateString();
  return events.filter(e => e.habitId === habitId && new Date(e.ts).toDateString() === todayStr).length;
}

function buildDock() {
  dockEl.innerHTML = '';
  habits.forEach(h => {
    tapCounts[h.id] = getTodayTapCount(h.id);

    const btn = document.createElement('button');
    btn.className = 'habit-btn';

    // Canvas icon
    const cvs = document.createElement('canvas');
    cvs.className = 'habit-icon';
    drawHexWedge(cvs, tapCounts[h.id]);
    btn.appendChild(cvs);

    // Label
    const lbl = document.createElement('span');
    lbl.className   = 'habit-label';
    lbl.textContent = h.label;
    btn.appendChild(lbl);

    btn.addEventListener('click', () => onHabitTap(h.id, btn, cvs));
    dockEl.appendChild(btn);
  });
}

function onHabitTap(habitId, btn, cvs) {
  const ev = { id:'c_'+Math.random().toString(16).slice(2), ts:Date.now(), habitId };
  events.push(ev);
  saveEvents(events);
  notifyWorkerEvents();

  // Increment tap count and redraw hex
  tapCounts[habitId] = (tapCounts[habitId] || 0) + 1;
  drawHexWedge(cvs, tapCounts[habitId]);

  btn.classList.add('tapped');
  setTimeout(() => btn.classList.remove('tapped'), 600);
}

// ── OffscreenCanvas + Worker path ─────────────────────────────────────────────
let worker    = null;
let usingWorker = false;

function notifyWorkerEvents() {
  if (worker) worker.postMessage({ type:'events', events });
}

function startWorker() {
  if (!('OffscreenCanvas' in window)) return false;
  if (!canvas.transferControlToOffscreen) return false;
  try {
    worker = new Worker('/bluemoon/vortex.worker.js');
    const dpr = window.devicePixelRatio || 1;
    const W   = window.innerWidth;
    const H   = window.innerHeight;
    const cH  = H * 0.667;
    // Must set pixel dimensions BEFORE transferControlToOffscreen
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(cH * dpr);
    canvas.style.width  = W  + 'px';
    canvas.style.height = cH + 'px';
    const offscreen = canvas.transferControlToOffscreen();
    worker.postMessage(
      { type:'init', canvas:offscreen, width:W, height:H, devicePixelRatio:dpr, events },
      [offscreen]
    );
    usingWorker = true;

    window.addEventListener('resize', () => {
      const W2=window.innerWidth, H2=window.innerHeight, cH2=H2*0.667;
      canvas.style.width=W2+'px'; canvas.style.height=cH2+'px';
      worker.postMessage({ type:'resize', width:W2, height:H2, devicePixelRatio:window.devicePixelRatio||1, events });
    });
    return true;
  } catch(e) { return false; }
}

// ── Fallback: inline Canvas2D ─────────────────────────────────────────────────
function startFallback() {
  // Inline the full engine as a script tag, then init
  const s = document.createElement('script');
  s.src   = '/bluemoon/vortex.fallback.js';
  s.onload = () => { if (window.VortexFallback) window.VortexFallback.init(canvas, events, habits); };
  document.head.appendChild(s);
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildDock();

const workerStarted = startWorker();
if (!workerStarted) startFallback();

// Center tap
document.getElementById('center-tap').addEventListener('click', () => {
  // Could open a relic screen — for now just a visual burst via worker
  if (worker) worker.postMessage({ type:'pulse' });
});

// ─────────────────────────────────────────────────────────────────────────────
// PWA — Install prompt
// ─────────────────────────────────────────────────────────────────────────────
let deferredPrompt = null;
const banner     = document.getElementById('install-banner');
const btnInstall = document.getElementById('btn-install');
const btnDismiss = document.getElementById('btn-dismiss');
const iosHint    = document.getElementById('ios-hint');
const btnIos     = document.getElementById('btn-ios-dismiss');

// Android / Chrome — standard prompt
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  banner.classList.add('show');
});

btnInstall.addEventListener('click', async () => {
  banner.classList.remove('show');
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});
btnDismiss.addEventListener('click', () => {
  banner.classList.remove('show');
  deferredPrompt = null;
});
window.addEventListener('appinstalled', () => banner.classList.remove('show'));

// iOS Safari — manual "Add to Home Screen" hint (shown once)
const isIos      = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone === true
  || window.matchMedia('(display-mode: standalone)').matches;

if (isIos && !isStandalone && !localStorage.getItem(STORAGE_KEY_IOS)) {
  setTimeout(() => iosHint.classList.add('show'), 2500);
}
btnIos.addEventListener('click', () => {
  iosHint.classList.remove('show');
  localStorage.setItem(STORAGE_KEY_IOS, '1');
});

// ─────────────────────────────────────────────────────────────────────────────
// Admin navbar — tab switching
// ─────────────────────────────────────────────────────────────────────────────
const overlay    = document.getElementById('panel-overlay');
const navTabs    = document.querySelectorAll('.nav-tab');
const panels     = {
  glyphs:  document.getElementById('panel-glyphs'),
  moon:    document.getElementById('panel-moon'),
  model:   document.getElementById('panel-model'),
  fractal: document.getElementById('panel-fractal'),
};
let activeTab    = null;
let modelInited  = false;
let glyphInited  = false;

function openPanel(name) {
  // Close if tapping active tab
  if (activeTab === name) {
    overlay.classList.remove('open');
    Object.values(panels).forEach(p => p.style.display = 'none');
    navTabs.forEach(t => t.classList.remove('active'));
    activeTab = null;
    return;
  }
  // Moon tab = close overlay (vortex visible)
  if (name === 'moon') {
    overlay.classList.remove('open');
    Object.values(panels).forEach(p => p.style.display = 'none');
    navTabs.forEach(t => t.classList.remove('active'));
    document.querySelector('[data-panel="moon"]').classList.add('active');
    activeTab = 'moon';
    return;
  }

  overlay.classList.add('open');
  Object.values(panels).forEach(p => p.style.display = 'none');
  const panel = panels[name];
  if (panel) panel.style.display = 'flex';
  navTabs.forEach(t => t.classList.remove('active'));
  document.querySelector('[data-panel="'+name+'"]').classList.add('active');
  activeTab = name;

  if (name === 'glyphs' && !glyphInited) { initGlyph(); glyphInited = true; }
  if (name === 'model'  && !modelInited) { initModel(); modelInited = true; }
}

navTabs.forEach(tab => {
  tab.addEventListener('click', () => openPanel(tab.dataset.panel));
});

// ─────────────────────────────────────────────────────────────────────────────
// Glyph panel — Sun Wukong wireframe (Canvas2D)
// ─────────────────────────────────────────────────────────────────────────────
const SW_VERTS = [
  [-0.011,0.500],[0.036,0.458],[0.083,0.456],[0.119,0.433],[0.068,0.414],
  [0.023,0.401],[-0.028,0.395],[-0.072,0.406],[-0.117,0.428],[-0.088,0.452],
  [-0.043,0.458],[0.123,0.375],[0.158,0.339],[0.167,0.286],[0.156,0.231],
  [0.132,0.186],[0.096,0.162],[0.055,0.154],[-0.055,0.154],[-0.096,0.162],
  [-0.132,0.186],[-0.156,0.231],[-0.167,0.286],[-0.158,0.339],[-0.123,0.375],
  [0.000,0.280],[0.041,0.254],[0.033,0.208],[-0.033,0.208],[-0.041,0.254],
  [0.000,0.175],[0.063,0.095],[0.111,0.052],[0.123,-0.006],[0.097,-0.060],
  [0.051,-0.091],[0.000,-0.098],[-0.051,-0.091],[-0.097,-0.060],[-0.123,-0.006],
  [-0.111,0.052],[-0.063,0.095],[0.020,0.037],[-0.020,0.037],[0.000,-0.003],
  [0.147,-0.120],[0.178,-0.179],[0.174,-0.248],[0.142,-0.301],[0.099,-0.321],
  [0.054,-0.309],[-0.054,-0.309],[-0.099,-0.321],[-0.142,-0.301],[-0.174,-0.248],
  [-0.178,-0.179],[-0.147,-0.120],[0.000,-0.160],[0.043,-0.185],[0.037,-0.236],
  [-0.037,-0.236],[-0.043,-0.185],[0.132,-0.349],[0.163,-0.406],[0.155,-0.459],
  [0.118,-0.490],[0.072,-0.498],[0.027,-0.493],[-0.027,-0.493],[-0.072,-0.498],
  [-0.118,-0.490],[-0.155,-0.459],[-0.163,-0.406],[-0.132,-0.349],[0.000,-0.380],

  'rgba(220,240,255,0.60)',      // 3 white/bright
];
const SHADE_STROKE = [
  'rgba(80,140,255,0.35)',
  'rgba(80,160,255,0.55)',
  'rgba(140,210,255,0.80)',
  'rgba(230,245,255,0.95)',

function initGlyph() {
  const cvs = document.getElementById('glyph-canvas');
  const size = Math.min(window.innerWidth, window.innerHeight * 0.72, 340);
  const dpr  = window.devicePixelRatio || 1;
  cvs.width  = size * dpr;
  cvs.height = size * dpr;
  cvs.style.width  = size + 'px';
  cvs.style.height = size + 'px';
  const ctx = cvs.getContext('2d');
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2, scale = size * 0.88;

  function proj(v) {
    return [cx + v[0] * scale, cy - v[1] * scale];
  }

  // Shadow layer (offset, slightly larger, dark)
  ctx.save();
  ctx.translate(2, 3);
  SW_TRIS.forEach((tri, i) => {
    const shade = SW_SHADES[i] || 0;
    const [ax, ay] = proj(SW_VERTS[tri[0]]);
    const [bx, by] = proj(SW_VERTS[tri[1]]);
    const [cx2, cy2] = proj(SW_VERTS[tri[2]]);
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx2, cy2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,10,40,0.25)';
    ctx.fill();
  });
  ctx.restore();

  // Main triangles
  SW_TRIS.forEach((tri, i) => {
    const shade = SW_SHADES[i] || 0;
    const [ax, ay] = proj(SW_VERTS[tri[0]]);
    const [bx, by] = proj(SW_VERTS[tri[1]]);
    const [cx2, cy2] = proj(SW_VERTS[tri[2]]);
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx2, cy2);
    ctx.closePath();
    ctx.fillStyle   = SHADE_COLORS[shade];
    ctx.strokeStyle = SHADE_STROKE[shade];
    ctx.lineWidth   = shade >= 2 ? 1.4 : 0.8;
    ctx.fill();
    ctx.stroke();
  });

  // Vertex glow nodes on outer rings (every 4th vertex)
  ctx.fillStyle = 'rgba(140,210,255,0.55)';
  SW_VERTS.forEach((v, i) => {
    if (i % 5 !== 0) return;
    const [px, py] = proj(v);
    ctx.beginPath();
    ctx.arc(px, py, 1.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

// Model panel — Three.js GLB viewer
// ─────────────────────────────────────────────────────────────────────────────
function initModel() {
  const cvs   = document.getElementById('model-canvas');
  const wrap   = document.getElementById('model-wrap');
  const W      = wrap.clientWidth  || window.innerWidth;
  const H      = Math.min(wrap.clientHeight || window.innerHeight * 0.75, window.innerHeight * 0.75);
  const size   = Math.min(W, H);
  const dpr    = window.devicePixelRatio || 1;
  cvs.width    = size * dpr;
  cvs.height   = size * dpr;
  cvs.style.width  = size + 'px';
  cvs.style.height = size + 'px';

  // Load Three.js from CDN then boot
  function loadScript(url, cb) {
    if (document.querySelector('script[data-src="'+url+'"]')) { cb(); return; }
    const s = document.createElement('script');
    s.src = url;
    s.setAttribute('data-src', url);
    s.onload = cb;
    document.head.appendChild(s);
  }

  const THREE_CDN = 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';

  // Use importmap-style dynamic import
  import('https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js').then(THREE => {
    import('https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/loaders/GLTFLoader.js').then(({ GLTFLoader }) => {
      import('https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/controls/OrbitControls.js').then(({ OrbitControls }) => {
        bootModel(THREE, GLTFLoader, OrbitControls, cvs, size, dpr);
      });
    });
  }).catch(err => {
    console.error('Three.js load failed', err);
    const ctx = cvs.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.fillStyle = 'rgba(80,160,255,0.25)';
    ctx.fillText('WebGL not available', 10, 20);
  });
}

function bootModel(THREE, GLTFLoader, OrbitControls, cvs, size, dpr) {
  // Renderer
  const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true, alpha: true });
  renderer.setPixelRatio(dpr);
  renderer.setSize(size, size, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.4;

  // Scene
  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 100);
  camera.position.set(0, 0.1, 2.8);

  // Lights
  const amb = new THREE.AmbientLight(0x8ab4ff, 0.7);
  scene.add(amb);
  const key = new THREE.DirectionalLight(0xffffff, 2.2);
  key.position.set(1.5, 2.5, 2);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x4488ff, 1.0);
  rim.position.set(-2, 0.5, -1.5);
  scene.add(rim);
  const fill = new THREE.PointLight(0xff8844, 0.5, 10);
  fill.position.set(0, -1, 1);
  scene.add(fill);

  // Orbit controls (touch-friendly)
  const controls = new OrbitControls(camera, cvs);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance   = 0.8;
  controls.maxDistance   = 6;
  controls.autoRotate    = true;
  controls.autoRotateSpeed = 1.2;

  // Load GLB
  const loader = new GLTFLoader();
  loader.load('/bluemoon/monkey.glb', gltf => {
    const model = gltf.scene;
    // Center and normalize
    const box = new THREE.Box3().setFromObject(model);
    const cen = box.getCenter(new THREE.Vector3());
    const siz = box.getSize(new THREE.Vector3()).length();
    model.position.sub(cen);
    model.scale.setScalar(2.0 / siz);
    scene.add(model);

    // Stop auto-rotate on touch/mouse
    controls.addEventListener('start', () => { controls.autoRotate = false; });
  }, undefined, err => {
    console.error('GLB load error', err);
  });

  // Animate
  let animId;
  function animate() {
    animId = requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Cleanup when panel hides (stop loop when not visible)
  const modelPanel = document.getElementById('panel-model');
  const obs = new MutationObserver(() => {
    if (modelPanel.style.display === 'none') {
      cancelAnimationFrame(animId);
      obs.disconnect();
    }
  });
  obs.observe(modelPanel, { attributes: true, attributeFilter: ['style'] });
}

// Service worker — unregister stale SW first, then re-register
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    const stale = regs.filter(r => r.scope.includes('/bluemoon') && !r.active?.scriptURL.includes('sw.js'));
    Promise.all(stale.map(r => r.unregister())).then(() => {
      navigator.serviceWorker.register('/bluemoon/sw.js').catch(()=>{});
    });
  }).catch(() => {
    navigator.serviceWorker.register('/bluemoon/sw.js').catch(()=>{});
  });
}
